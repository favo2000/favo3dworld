<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>GLB preview regression check</title><link rel="stylesheet" href="../product-3d.css">
<style>body{font:16px system-ui;margin:16px}button{min-height:44px}iframe{display:block;width:390px;max-width:100%;height:760px;border:1px solid #888}article{max-width:350px;padding:16px;background:#eef6f4}</style>
<script src="../supabase-config.js"></script><script src="../product-3d.js"></script>
<h1>GLB preview regression check</h1><p>Read-only viewer test. No product data is changed.</p><label>Local synthetic GLB (not uploaded)<input id="local" type="file" accept=".glb"></label><p id="localStatus"></p><button id="language">DE / FR</button><article id="fixture"><h2>Synthetic test model</h2><p>Image-first product placeholder</p></article><output id="camera" aria-live="polite"></output><div id="mobile"></div>
<script>
const params=new URLSearchParams(location.search),path=params.get('model');
let localURL;
document.getElementById('local').onchange=async event=>{try{const file=event.target.files[0];await Favo3D.validateFile(file);if(localURL)URL.revokeObjectURL(localURL);localURL=URL.createObjectURL(file);Favo3D.attachButton(document.getElementById('fixture'),{name:'Synthetic local test model',glb_path:'00000000-0000-4000-8000-000000000000.glb'},null);document.getElementById('localStatus').textContent='Local fixture ready; no upload.';}catch(e){document.getElementById('localStatus').textContent=e.message;}};
Favo3D.attachButton(document.getElementById('fixture'),{name:'Synthetic test model',glb_path:path},null);
document.getElementById('language').onclick=()=>{document.documentElement.lang=document.documentElement.lang==='de'?'fr':'de';Favo3D.refreshLanguage();};
new MutationObserver(()=>{const v=document.querySelector('model-viewer');if(v&&!v.dataset.observed){v.dataset.observed='true';if(localURL)v.src=localURL;v.addEventListener('camera-change',()=>{const o=v.getCameraOrbit();document.getElementById('camera').textContent=JSON.stringify({theta:o.theta,phi:o.phi,radius:o.radius});});}}).observe(document.body,{childList:true,subtree:true});
if(!params.has('narrow')){const frame=document.createElement('iframe');frame.title='390px mobile layout';const next=new URL(location.href);next.searchParams.set('narrow','1');frame.src=next.href;document.getElementById('mobile').append(frame);}
</script></html>
